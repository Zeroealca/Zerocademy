services:
  backend:
    # The development entrypoint runs migrations and seed work. Acceptance uses
    # the already-provisioned isolated database, so bypass it entirely.
    entrypoint: []
    command: ["npm", "run", "start:dev", "-w", "backend-zerocademy"]
    environment:
      DATABASE_URL: postgresql://zerocademy:zerocademy_secret@postgres:5432/zerocademy_e2e?schema=public
      DATABASE_URL_UNPOOLED: postgresql://zerocademy:zerocademy_secret@postgres:5432/zerocademy_e2e?schema=public
      POSTGRES_DB: zerocademy_e2e
      RUN_PRISMA_SEED: "false"
      NODE_PATH: /app/BackendZerocademy/node_modules:/app/node_modules

  frontend:
    working_dir: /app/FrontendZerocademy
    command: ["npm", "run", "dev:docker"]
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      INTERNAL_API_URL: http://backend:3001
    # Keep acceptance compilation artifacts isolated from the shared development
    # cache. The latter can belong to a different local Next application.
    volumes: !override
      - ./FrontendZerocademy/src:/app/FrontendZerocademy/src
      - ./FrontendZerocademy/public:/app/FrontendZerocademy/public
      - ./FrontendZerocademy/next.config.ts:/app/FrontendZerocademy/next.config.ts:ro
      - ./FrontendZerocademy/postcss.config.mjs:/app/FrontendZerocademy/postcss.config.mjs:ro
      - ./FrontendZerocademy/tsconfig.json:/app/FrontendZerocademy/tsconfig.json:ro
      - frontend_node_modules:/app/node_modules
      - frontend_e2e_next_cache:/app/FrontendZerocademy/.next
    ports: !override
      - "3002:3000"

volumes:
  frontend_e2e_next_cache:
