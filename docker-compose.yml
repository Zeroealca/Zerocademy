# Development stack for the Zerocademy monorepo (npm workspaces).
# Run from repo root: npm run docker:up

name: zerocademy

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — persistent data volume, internal network only (no host port
  # required; expose POSTGRES_PORT if you need host access for local tools).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: zerocademy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerocademy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerocademy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zerocademy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - zerocademy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zerocademy} -d ${POSTGRES_DB:-zerocademy_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # pgAdmin — connects to postgres via Docker DNS hostname "postgres"
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: zerocademy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the Postgres service (hostname "postgres" on the Docker network)
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zerocademy-network

  # ---------------------------------------------------------------------------
  # NestJS API — waits for Postgres, runs migrations, hot reload via volumes
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: BackendZerocademy/Dockerfile
      target: development
    container_name: zerocademy-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zerocademy}:${POSTGRES_PASSWORD:-zerocademy_secret}@postgres:5432/${POSTGRES_DB:-zerocademy_db}?schema=public
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # npm workspaces: @nestjs/core is hoisted to /app/node_modules; platform-express stays in BackendZerocademy/node_modules
      NODE_PATH: /app/BackendZerocademy/node_modules:/app/node_modules
      # File watching inside Docker (macOS/Windows bind mounts)
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      # Source mounts for NestJS --watch (node_modules stay in the image)
      - ./BackendZerocademy/src:/app/BackendZerocademy/src:cached
      - ./BackendZerocademy/prisma:/app/BackendZerocademy/prisma:cached
      - ./BackendZerocademy/test:/app/BackendZerocademy/test:cached
      - ./BackendZerocademy/tsconfig.json:/app/BackendZerocademy/tsconfig.json:ro
      - ./BackendZerocademy/tsconfig.build.json:/app/BackendZerocademy/tsconfig.build.json:ro
      - ./BackendZerocademy/nest-cli.json:/app/BackendZerocademy/nest-cli.json:ro
      # node_modules live in the image only. After package.json / lock changes:
      #   docker compose build backend && docker compose up -d backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zerocademy-network

  # ---------------------------------------------------------------------------
  # Next.js — browser uses localhost:3001 for API; dev server binds 0.0.0.0
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: FrontendZerocademy/Dockerfile
      target: development
    container_name: zerocademy-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./FrontendZerocademy/src:/app/FrontendZerocademy/src:cached
      - ./FrontendZerocademy/public:/app/FrontendZerocademy/public:cached
      - ./FrontendZerocademy/next.config.ts:/app/FrontendZerocademy/next.config.ts:ro
      - ./FrontendZerocademy/postcss.config.mjs:/app/FrontendZerocademy/postcss.config.mjs:ro
      - ./FrontendZerocademy/tsconfig.json:/app/FrontendZerocademy/tsconfig.json:ro
      # After Dockerfile native-dep changes:
      #   docker volume rm zerocademy_frontend_node_modules && docker compose up --build frontend
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/FrontendZerocademy/.next
    depends_on:
      - backend
    networks:
      - zerocademy-network

networks:
  zerocademy-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
  frontend_next_cache:
