# Development stack for the Notas monorepo (npm workspaces).
# Run from repo root: npm run docker:up

name: notas

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — persistent data volume, internal network only (no host port
  # required; expose POSTGRES_PORT if you need host access for local tools).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: notas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notas_secret}
      POSTGRES_DB: ${POSTGRES_DB:-notas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - notas-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-notas} -d ${POSTGRES_DB:-notas_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # pgAdmin — connects to postgres via Docker DNS hostname "postgres"
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: notas-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the Postgres service (hostname "postgres" on the Docker network)
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - notas-network

  # ---------------------------------------------------------------------------
  # NestJS API — waits for Postgres, runs migrations, hot reload via volumes
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: BackendNotas/Dockerfile
      target: development
    container_name: notas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-notas}:${POSTGRES_PASSWORD:-notas_secret}@postgres:5432/${POSTGRES_DB:-notas_db}?schema=public
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # npm workspaces: @nestjs/core is hoisted to /app/node_modules; platform-express stays in BackendNotas/node_modules
      NODE_PATH: /app/BackendNotas/node_modules:/app/node_modules
      # File watching inside Docker (macOS/Windows bind mounts)
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      # Source mounts for NestJS --watch (node_modules stay in image/volumes)
      - ./BackendNotas/src:/app/BackendNotas/src:cached
      - ./BackendNotas/prisma:/app/BackendNotas/prisma:cached
      - ./BackendNotas/test:/app/BackendNotas/test:cached
      - ./BackendNotas/tsconfig.json:/app/BackendNotas/tsconfig.json:ro
      - ./BackendNotas/tsconfig.build.json:/app/BackendNotas/tsconfig.build.json:ro
      - ./BackendNotas/nest-cli.json:/app/BackendNotas/nest-cli.json:ro
      # Entrypoint scripts are baked into the image (do not bind-mount — breaks execute bit)
      # node_modules live in the image only (npm workspaces). After package.json / lock changes:
      #   docker compose build backend && docker compose up -d backend
      # Do NOT mount a node_modules volume — it desyncs hoisted vs workspace-local deps (node-emoji / nest cli).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - notas-network

  # ---------------------------------------------------------------------------
  # Next.js — browser uses localhost:3001 for API; dev server binds 0.0.0.0
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: FrontendNotas/Dockerfile
      target: development
    container_name: notas-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./FrontendNotas/src:/app/FrontendNotas/src:cached
      - ./FrontendNotas/public:/app/FrontendNotas/public:cached
      - ./FrontendNotas/next.config.ts:/app/FrontendNotas/next.config.ts:ro
      - ./FrontendNotas/postcss.config.mjs:/app/FrontendNotas/postcss.config.mjs:ro
      - ./FrontendNotas/tsconfig.json:/app/FrontendNotas/tsconfig.json:ro
      # Hoisted deps from image (Tailwind/lightningcss Linux binaries). After Dockerfile native-dep
      # changes, run: docker volume rm notas_frontend_node_modules && docker compose up --build frontend
      - frontend_node_modules:/app/node_modules
      # Next.js cache — speeds up rebuilds between restarts
      - frontend_next_cache:/app/FrontendNotas/.next
    depends_on:
      - backend
    networks:
      - notas-network

networks:
  notas-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
  frontend_next_cache:
